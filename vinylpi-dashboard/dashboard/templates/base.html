<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090a"><title>{% block title %}VinylPi Dashboard{% endblock %}</title><meta name="description" content="Private control center for vinyl playback, music services, and connected devices."><meta property="og:type" content="website"><meta property="og:title" content="VinylPi Dashboard"><meta property="og:description" content="Private control center for vinyl playback, music services, and connected devices."><meta property="og:url" content="/"><meta property="og:image" content="/static/social-preview.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="VinylPi Dashboard"><meta name="twitter:description" content="Private control center for vinyl playback, music services, and connected devices."><meta name="twitter:image" content="/static/social-preview.png"><link rel="icon" href="/static/favicon.ico?v=2" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=2"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=2"><link rel="stylesheet" href="/static/theme.css?v=45"><script src="/static/app.js?v=45" defer></script><script src="/static/persistent-nav.js?v=45" defer></script><link rel="stylesheet" href="/static/playlists.css?v=2"><script defer src="/static/playlists.js?v=2"></script><script defer src="/static/stream.js?v=1"></script></head>
<body><div class="wrap"><header class="top">
<a class="brand" href="/" aria-label="VinylPi home"><span class="brand-wordmark" aria-hidden="true">VINYLPI<span class="brand-triangle"></span></span></a>
<div class="header-player" aria-label="Vinyl stream player"><span class="stream-dot" aria-hidden="true"></span><div class="player-label"><strong>Vinyl stream</strong><small>{% if stream_ready %}Live from VinylPi{% else %}Stream unavailable{% endif %}</small></div>
{% if stream_ready %}<audio id="vinyl-player" controls preload="none" aria-label="Live vinyl stream"><source src="/stream/audio" type="audio/mpeg">Audio playback is not supported.</audio>{% else %}<span class="player-placeholder" title="Set VINYLPI_STREAM_URL to your local Icecast mount">Stream unavailable</span>{% endif %}</div>
<div class="toolbar"><label for="theme" class="sr-only">Theme</label><span class="theme-control"><span class="theme-glyph" aria-hidden="true">◐</span><select id="theme" data-theme-select aria-label="Theme"><option value="dark">Dark</option><option value="light">Light</option><option value="royal">Royal</option><option value="eternal-blue">Eternal Blue</option><option value="language">Language</option></select></span><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{csrf}}"><button type="submit" class="quiet-button">Sign out</button></form></div></header>
<nav aria-label="Primary"><a href="/" {% if active_page=='/' %}aria-current="page"{% endif %}>Overview</a><a href="/services" {% if active_page.startswith('/services') %}aria-current="page"{% endif %}>Services</a><a href="/playlists" {% if active_page.startswith('/playlists') %}aria-current="page"{% endif %}>Playlists</a><a href="/display" {% if active_page=='/display' %}aria-current="page"{% endif %}>Display</a><a href="/stream" {% if active_page=='/stream' %}aria-current="page"{% endif %}>Stream</a><a href="/learning" {% if active_page.startswith('/learning') %}aria-current="page"{% endif %}>Learning</a><a href="/notifications" {% if active_page.startswith('/notifications') %}aria-current="page"{% endif %}>Notifications</a></nav>
<main>{% block body %}{% endblock %}</main><footer><a href="https://github.com/statticus19/VinylPi" target="_blank" rel="noopener noreferrer">VinylPi on GitHub ↗</a><span>VinylPi · Private dashboard</span></footer></div></body></html>
