name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r pi_epaper/requirements-orchestrator.txt
      - run: python tools/check_public_bundle.py
      - run: python -m unittest discover -s pi_epaper -p 'test_*.py'
